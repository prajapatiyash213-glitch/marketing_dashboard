name: Weekly Google Sheet Sync

on:
  schedule:
    # Runs every Monday at 09:30 UTC
    - cron: '30 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Sync Google Sheet
        run: node scripts/sync-google-sheet.mjs

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/master/KPI\ _\ Automation\ COE\ \(2\).xlsx public/master/google_sheet_sync.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "[Automated] Weekly Google Sheet sync [skip ci]" && git push)
